<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Label the Cell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Label the cell</h1>
    <p class="sub">Pick a cell, then type the name of each structure into its box. Get it right and the box turns green and shows the definition.</p>
  </div>
  <div class="tools">
    <button class="t" id="hintBtn" aria-pressed="false">Show hints</button>
    <button class="t" id="revealBtn">Reveal all</button>
    <button class="t" id="resetBtn">Start over</button>
  </div>
</header>
<div class="tabs" role="tablist"><button class="tab" role="tab" data-k="animal" aria-selected="true">Animal cell</button><button class="tab" role="tab" data-k="plant" aria-selected="false">Plant cell</button><button class="tab" role="tab" data-k="prokaryote" aria-selected="false">Bacteria cell</button></div>
<div class="score"><div class="bar"><i id="bar"></i></div><div class="count" id="count">0 / 0</div></div>
<div class="scroll"><div class="stage" id="stage"><img id="pic" alt="" src=""></div></div>
<p class="hint-note">Press Enter to check a guess. Wide diagram on a phone? Scroll sideways. Tap a green label to reopen its definition.</p>
<h2>Definitions</h2>
<div class="cards" id="cards"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
